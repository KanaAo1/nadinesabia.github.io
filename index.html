</head>
<style>
        :root {
            --primary: #f77f97;         /* Pink Cantik */
            --primary-dark: #e04a6b;    /* Pink Gelap untuk Hover/Title */
            --secondary: #ffb1c1;       /* Pink Pastel */
            --bg-color: #f59cab;        /* Background Lembut Pink Muda */
            --text-color: #4a4a4a;
            
            
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            scroll-behavior: smooth;
        }

        /* Navigasi */
        nav {
            background-color: #ffe8f4;
            color: var(--primary-dark);
            padding: 15px 30px;
            display: flex;
            justify-content: right;
            align-items: right;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 2px 10px rgba(201, 41, 73, 0.15);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary-dark);
        }

        .nav-links a {
            color: #555;
            text-decoration: none;
            margin-left: 20px;
            font-weight: 500;
            transition: 0.3s;
        }

        .nav-links a:hover {
            color: var(--primary);
        }

        /* Header / Banner */
        header {
             background-image:
             url("https://pin.it/4Loj1mZqX");

             background-size: cover;
             background-position: center;
             background-repeat: no-repeat;

             color:white;
             text-align: center;

              padding: 120px 20px;
              }

        .btn {
            display: inline-block;
            background-color: var(--primary);
            color: white;
            padding: 12px 25px;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 10px rgba(255, 101, 132, 0.3);
        }

        .btn:hover {
            background-color: var(--primary-dark);
            transform: scale(1.05);
        }

        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }

        h2 {
            text-align: center;
            margin-bottom: 30px;
            color: var(--primary-dark);
            font-size: 2.2rem;
        }

        .section-title {
            margin-top: 40px;
            margin-bottom: 20px;
            color: var(--primary-dark);
            border-bottom: 2px dashed var(--secondary);
            padding-bottom: 5px;
        }

        /* Badge Favorit */
        .favorite-badge {
            background-color: #ff6584;
            color: white;
            padding: 4px 10px;
            font-size: 0.75rem;
            font-weight: bold;
            border-radius: 10px;
            display: inline-block;
            margin-bottom: 8px;
        }

        /* Grid Produk */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .menu-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(255, 101, 132, 0.1);
            transition: 0.3s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 1px solid #ffe6eb;
        }

        .menu-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 8px 25px rgba(255, 101, 132, 0.2);
        }

        .menu-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .menu-info {
            padding: 15px;
        }

        .menu-info h3 {
            margin-bottom: 5px;
            font-size: 1.2rem;
            color: #333;
        }

        .menu-info p {
            color: #777;
            font-size: 0.85rem;
            margin-bottom: 10px;
            height: 35px;
            overflow: hidden;
        }

        .price-cart {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 15px 15px 15px;
        }

        .price {
            font-weight: bold;
            color: var(--primary-dark);
            font-size: 1.1rem;
        }

        .btn-add {
            background-color: var(--secondary);
            color: #fff;
            border: none;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-add:hover {
            background-color: var(--primary);
        }

        /* Keranjang & Checkout Section */
        .order-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(255, 101, 132, 0.1);
            margin-top: 40px;
            border: 1px solid #ffe6eb;
        }

        @media(max-width: 768px) {
            .order-container {
                grid-template-columns: 1fr;
            }
        }

        .cart-box h3, .checkout-box h3 {
            margin-bottom: 20px;
            color: var(--primary-dark);
        }

        .cart-items {
            list-style: none;
            max-height: 200px;
            overflow-y: auto;
            margin-bottom: 15px;
            border-bottom: 1px solid #ffe6eb;
            padding-bottom: 10px;
        }

        .cart-items li {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 0.95rem;
        }

        .cart-total {
            font-size: 1.2rem;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            color: var(--primary-dark);
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            color: #555;
        }

        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ffb1c1;
            border-radius: 8px;
            font-size: 0.95rem;
            background-color: #fff9fa;
        }

        .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 5px rgba(255, 101, 132, 0.3);
        }

        /* Profile Toko */
        .profile-section {
            background: linear-gradient(135deg, #ff6584, #ff8da1);
            color: white;
            padding: 60px 20px;
            margin-top: 60px;
            text-align: center;
            border-radius: 20px 20px 0 0;
        }

        .profile-section h2 {
            color: white;
            margin-bottom: 20px;
        }

        .profile-section p {
            max-width: 700px;
            margin: 15px auto;
            line-height: 1.6;
            color: #fff0f3;
            font-size: 1.05rem;
        }

        footer {
            background-color: #e04a6b;
            color: white;
            text-align: center;
            padding: 20px;
            font-size: 0.9rem;
        }
    </style>
